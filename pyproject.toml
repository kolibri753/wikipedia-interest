[project]
name = "wikipedia-interest"
version = "0.1.0"
description = "Agent Skill: analyze Wikipedia pageview trends across language editions (charts + PDF report)."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "matplotlib>=3.8,<4",
    "reportlab>=4.0,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # pyflakes + the pycodestyle errors that catch real bugs; long lines are not gated
